name: release-builds

on:
  release:
    branches: [ main ]
    types: [ published ]

jobs:
  build:
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'generic/platform=macOS'
          - 'generic/platform=iOS Simulator'

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-xcode
    - name: Build / Test
      if: matrix.destination == 'generic/platform=macOS'
      run: swift test -v -Xswiftc -warnings-as-errors
    - name: Build iOS / macOS
      run: xcodebuild -verbose -skipPackagePluginValidation -scheme iTunes -destination '${{ matrix.destination }}'

  format:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/check-format
